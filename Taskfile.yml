# https://taskfile.dev

version: "3"

tasks:
  test-pdfs:
    desc: Build the chart and export PDFs with the GitHub Actions exporter
    cmds:
      - npm exec --yes --package=pnpm@10.28.2 -- pnpm --dir chart-ui install --frozen-lockfile
      - npm install --prefix .github/scripts --no-fund --no-audit --package-lock=false
      - node .github/scripts/build-pdfs.mjs {{.CLI_ARGS}}
