name: Publish themed chart and legacy archive
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to regenerate PDFs for (optional)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the last published static chart
        uses: actions/checkout@v7
        with:
          ref: ead96618bc233d50ad5a7b9b4465b0b20af4c4a7
          path: legacy-site
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10.28.2
      - name: Install locked chart dependencies
        working-directory: chart-ui
        run: pnpm install --frozen-lockfile
      - name: Validate application and RDF compatibility
        working-directory: chart-ui
        run: node scripts/check-chart-data.mjs
      - name: Generate the chart
        working-directory: chart-ui
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /chart/
      - name: Validate archive rebasing
        run: ruby scripts/test_assemble_sites.rb
      - name: Assemble current chart and /old
        run: ruby scripts/assemble_sites.rb chart-ui/.output/public legacy-site _site /chart
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Upload chart for release PDF generation
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@v7
        with:
          name: chart-ui-build
          path: chart-ui/.output/public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  publish-pdfs:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    uses: ./.github/workflows/generate-pdfs.yml
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
    permissions:
      contents: write
