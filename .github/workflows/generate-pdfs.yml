name: Generate PDFs on release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Download chart-ui build
        uses: actions/download-artifact@v4
        with:
          name: chart-ui-build
          path: chart-ui-build

      - name: Install PDF export dependencies
        run: npm install --prefix .github/scripts --no-fund --no-audit --package-lock=false

      - name: Generate PDFs using the shared local and CI exporter
        run: >-
          node .github/scripts/build-pdfs.mjs
          --build-dir chart-ui-build
          --chrome-path "${{ steps.setup-chrome.outputs.chrome-path }}"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chart-pdf
          path: output/pdf/*.pdf

      - name: Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: output/pdf/*.pdf
