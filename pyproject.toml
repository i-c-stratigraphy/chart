[project]
name = "chart"
version = "2026.6.5"
description = ""
authors = [{ name = "Nicholas Car", email = "nick@kurrawong.ai" }]
requires-python = ">=3.15,<3.16"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.15"]
dependencies = [
    "kurra>=2.3.6,<3",
    "pandas>=2.2.3,<3",
    "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = ["black>=24.10.0,<25"]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
